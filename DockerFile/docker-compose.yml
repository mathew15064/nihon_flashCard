networks:
  shared_network:
    name: my_shared_network
    external: true

services:
  nihon_flashcard_container:
    image: node:22
    container_name: nihon_flashcard_container
    tty: true
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    working_dir: /var/www/html
    command:
      - sh
      - -c
      - |
        npm install &&
        npm run start
    networks:
      - shared_network


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Flashcard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment min-h-screen">

  <nav class="apple-nav">
    <div class="max-w-4xl w-full mx-auto px-6 flex items-center justify-between">
      <span class="apple-nav-brand">Japanese Flashcard</span>
      <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-3 py-1 text-xs text-white" aria-label="Language">
        <option value="vi">VI</option>
        <option value="en">EN</option>
      </select>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-16">
    <header class="text-center mb-12">
      <h1 class="apple-headline apple-headline-lg mb-3" data-i18n="userSelect.title">Japanese Flashcard</h1>
      <p class="apple-subhead" data-i18n="userSelect.subtitle">Who is learning today?</p>
    </header>

    <p id="error" class="hidden mb-6 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm"></p>

    <section class="apple-card">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold" data-i18n="userSelect.users">Users</h2>
        <button id="new-user-btn" class="apple-btn apple-btn-primary" data-i18n="userSelect.newUser">New user</button>
      </div>

      <form id="new-user-form" class="hidden mb-6 flex flex-wrap gap-2">
        <input id="username-input" type="text" placeholder="Username" required maxlength="50"
          class="apple-input flex-1 min-w-[10rem]" />
        <input id="displayname-input" type="text" placeholder="Display name (optional)" maxlength="50"
          class="apple-input flex-1 min-w-[10rem]" />
        <button type="submit" class="apple-btn apple-btn-primary" data-i18n="userSelect.create">Create</button>
      </form>

      <ul id="user-list" class="space-y-3">
        <li class="text-ink-muted text-sm" data-i18n="userSelect.loading">Loading users…</li>
      </ul>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/user.js"></script>
</body>
</html>

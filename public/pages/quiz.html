<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Flashcard — Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/pages/dashboard.html" class="text-slate-600 hover:underline text-sm">&larr; Dashboard</a>
      <h1 class="font-bold text-slate-800">Quiz</h1>
      <span></span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
    <p id="error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-2 text-sm"></p>

    <!-- ============ CONFIG ============ -->
    <section id="config-view" class="bg-white rounded-2xl shadow p-6 space-y-5">
      <div>
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Content type</h2>
        <div id="type-options" class="flex flex-wrap gap-2"></div>
      </div>

      <div>
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Number of questions</h2>
        <div id="count-options" class="flex gap-2"></div>
      </div>

      <div>
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Question type</h2>
        <div id="qtype-options" class="flex flex-wrap gap-2"></div>
      </div>

      <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-3 rounded-xl">
        Start quiz
      </button>
    </section>

    <!-- ============ PLAY ============ -->
    <section id="play-view" class="hidden">
      <p id="quiz-progress" class="text-center text-sm text-slate-500 mb-4"></p>

      <div class="bg-white rounded-2xl shadow-lg p-8 min-h-[10rem] flex items-center justify-center text-center mb-6">
        <p id="question-prompt" class="text-4xl sm:text-6xl font-semibold text-slate-800 break-all"></p>
      </div>

      <div id="options" class="grid gap-3"></div>

      <div id="feedback" class="hidden mt-4 rounded-xl p-4 text-center"></div>

      <button id="next-btn" class="hidden mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl">
        Next question
      </button>
    </section>

    <!-- ============ RESULT ============ -->
    <section id="result-view" class="hidden bg-white rounded-2xl shadow p-8 text-center">
      <p class="text-5xl mb-3" id="result-emoji"></p>
      <p class="text-4xl font-bold text-indigo-700 mb-1" id="result-score"></p>
      <p class="text-slate-500 mb-6" id="result-summary"></p>

      <div id="result-breakdown" class="space-y-2 text-left max-h-80 overflow-y-auto mb-6"></div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button id="retry-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm">Retry</button>
        <a href="/pages/dashboard.html" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-3 rounded-xl text-sm text-center">Back to dashboard</a>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>

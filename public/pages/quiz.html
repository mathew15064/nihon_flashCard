<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Japanese Flashcard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment min-h-screen">

  <nav class="apple-nav">
    <div class="max-w-3xl w-full mx-auto px-4 flex items-center justify-between gap-3">
      <a href="/pages/dashboard.html" class="apple-nav-brand" data-i18n="nav.dashboard">Dashboard</a>
      <div class="flex items-center gap-2">
        <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <header class="text-center mb-8">
      <h1 class="apple-headline" data-i18n="quiz.title">Quiz</h1>
    </header>

    <p id="error" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-2 text-sm"></p>

    <section id="config-view" class="apple-card space-y-6">
      <div>
        <h2 class="apple-caption uppercase tracking-wide mb-3" data-i18n="quiz.contentType">Content type</h2>
        <div id="type-options" class="flex flex-wrap gap-2"></div>
      </div>
      <div>
        <h2 class="apple-caption uppercase tracking-wide mb-3" data-i18n="quiz.questionCount">Number of questions</h2>
        <div id="count-options" class="flex gap-2"></div>
      </div>
      <div>
        <h2 class="apple-caption uppercase tracking-wide mb-3" data-i18n="quiz.questionType">Question type</h2>
        <div id="qtype-options" class="flex flex-wrap gap-2"></div>
      </div>
      <button id="start-btn" class="apple-btn apple-btn-primary w-full" data-i18n="quiz.start">Start quiz</button>
    </section>

    <section id="play-view" class="hidden">
      <p id="quiz-progress" class="text-center apple-caption mb-4"></p>
      <div class="apple-card p-8 min-h-[10rem] flex items-center justify-center text-center mb-6">
        <p id="question-prompt" class="text-4xl sm:text-6xl font-semibold text-ink break-all"></p>
      </div>
      <div id="options" class="grid gap-3"></div>
      <div id="feedback" class="hidden mt-4 rounded-[18px] p-4 text-center"></div>
      <button id="next-btn" class="hidden mt-4 w-full apple-btn apple-btn-primary" data-i18n="quiz.next">Next question</button>
    </section>

    <section id="result-view" class="hidden apple-card p-8 text-center">
      <p class="text-xl font-semibold mb-3" id="result-emoji"></p>
      <p class="text-5xl font-semibold text-action mb-2" id="result-score"></p>
      <p class="apple-caption mb-6" id="result-summary"></p>
      <div id="result-breakdown" class="space-y-2 text-left max-h-80 overflow-y-auto mb-6"></div>
      <div class="flex flex-col sm:flex-row gap-3">
        <button id="retry-btn" class="apple-btn apple-btn-primary flex-1" data-i18n="quiz.retry">Retry</button>
        <a href="/pages/dashboard.html" class="apple-btn apple-btn-secondary flex-1 text-center" data-i18n="quiz.backToDashboard">Back to dashboard</a>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment min-h-screen">

  <nav class="apple-nav">
    <div class="max-w-5xl w-full mx-auto px-6 flex items-center justify-between gap-3">
      <span class="apple-nav-brand">Japanese Flashcard</span>
      <div class="flex items-center gap-3">
        <span id="current-user" class="text-white/70"></span>
        <button id="switch-user-btn" data-i18n="dashboard.switchUser">Switch user</button>
        <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-3 py-1 text-xs text-white" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-12">
    <header class="mb-10">
      <h1 id="welcome" class="apple-headline mb-3"></h1>
      <p id="stats-loading" class="apple-caption" data-i18n="dashboard.statsLoading">Loading statistics…</p>
    </header>

    <section id="totals" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10"></section>

    <nav class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-12">
      <a href="/pages/learn.html" class="apple-card hover:border-action transition-colors text-center py-6">
        <p class="text-base font-semibold">Learn</p>
      </a>
      <a href="/pages/review.html" class="apple-card hover:border-action transition-colors text-center py-6">
        <p class="text-base font-semibold">Review</p>
      </a>
      <a href="/pages/quiz.html" class="apple-card hover:border-action transition-colors text-center py-6">
        <p class="text-base font-semibold">Quiz</p>
      </a>
      <a href="/pages/history.html" class="apple-card hover:border-action transition-colors text-center py-6">
        <p class="text-base font-semibold">History</p>
      </a>
      <a href="/pages/management.html" class="apple-card hover:border-action transition-colors text-center py-6">
        <p class="text-base font-semibold">Manage</p>
      </a>
    </nav>

    <section class="mb-10">
      <h2 class="apple-headline text-2xl mb-4" data-i18n="dashboard.progressByType">Progress by content type</h2>
      <div id="by-type" class="space-y-3"></div>
    </section>

    <section id="lesson-section" class="hidden">
      <h2 class="apple-headline text-2xl mb-4" data-i18n="dashboard.vocabByLesson">Vocabulary by lesson</h2>
      <div id="by-lesson" class="space-y-2"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>

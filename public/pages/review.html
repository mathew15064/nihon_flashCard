<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review — Japanese Flashcard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment min-h-screen">

  <nav class="apple-nav">
    <div class="max-w-3xl w-full mx-auto px-4 flex items-center justify-between gap-3">
      <a href="/pages/dashboard.html" class="apple-nav-brand" data-i18n="nav.dashboard">Dashboard</a>
      <div class="flex items-center gap-2">
        <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
        <select id="content-type" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Content type">
          <option value="" data-i18n="review.allTypes">All types</option>
          <option value="hiragana" data-i18n="content.hiragana">Hiragana</option>
          <option value="katakana" data-i18n="content.katakana">Katakana</option>
          <option value="kanji" data-i18n="content.kanji">Kanji</option>
          <option value="vocabulary" data-i18n="content.vocabulary">Vocabulary</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <header class="text-center mb-8">
      <h1 class="apple-headline" data-i18n="review.title">Review</h1>
    </header>

    <p id="error" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-2 text-sm"></p>

    <div id="session-info" class="text-center apple-caption mb-4"></div>

    <div id="card" class="hidden bg-white border border-hairline rounded-[18px] p-10 min-h-[16rem] flex flex-col items-center justify-center text-center cursor-pointer select-none">
      <p class="apple-caption uppercase tracking-wide mb-3"></p>
      <p id="card-front" class="text-5xl sm:text-7xl font-semibold text-ink break-all"></p>
      <div id="card-back" class="hidden mt-6 border-t border-hairline pt-6 w-full">
        <p id="answer-reading" class="hidden text-2xl text-ink-soft"></p>
        <p id="answer-romanization" class="hidden text-lg italic text-ink-muted"></p>
        <p id="answer-main" class="mt-4 text-3xl font-semibold text-action"></p>
        <p id="answer-extra" class="mt-2 text-ink-muted break-words"></p>
      </div>
    </div>

    <div id="done-panel" class="hidden apple-card p-10 text-center">
      <p class="apple-headline text-2xl mb-3" data-i18n="review.sessionComplete">Session complete</p>
      <p id="done-summary" class="apple-caption mb-6"></p>
      <button id="reload-btn" class="apple-btn apple-btn-primary" data-i18n="review.loadMore">Load more</button>
    </div>

    <div class="mt-10 flex justify-center gap-3 max-w-md mx-auto">
      <button id="wrong-btn" disabled class="apple-btn apple-btn-wrong flex-1" data-i18n="learn.wrong">Wrong</button>
      <button id="reveal-btn" class="apple-btn apple-btn-dark flex-1" data-i18n="learn.reveal">Reveal</button>
      <button id="correct-btn" disabled class="apple-btn apple-btn-correct flex-1" data-i18n="learn.correct">Correct</button>
    </div>
    <p id="status-line" class="text-center apple-caption mt-3 h-4"></p>
    <p class="text-center apple-caption mt-2" data-i18n="learn.hint"></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/card-render.js"></script>
  <script src="/js/review.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History — Japanese Flashcard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment min-h-screen">

  <nav class="apple-nav">
    <div class="max-w-3xl w-full mx-auto px-4 flex items-center justify-between gap-3">
      <a href="/pages/dashboard.html" class="apple-nav-brand" data-i18n="nav.dashboard">Dashboard</a>
      <div class="flex items-center gap-2">
        <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <header class="flex items-center justify-between gap-3 mb-6">
      <h1 class="apple-headline" data-i18n="history.title">History</h1>
      <select id="month" class="apple-input text-sm !py-1.5 !min-h-[36px]">
        <option value="" data-i18n="history.thisMonth">This month</option>
        <option value="all" data-i18n="history.allMonths">All months</option>
      </select>
    </header>

    <p id="error" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-2 text-sm"></p>

    <div id="summary" class="hidden grid grid-cols-3 gap-3 mb-6 text-center"></div>

    <ul id="event-list" class="space-y-2">
      <li class="apple-caption" data-i18n="history.loading">Loading history…</li>
    </ul>

    <div class="flex justify-center gap-3 mt-8">
      <button id="prev-btn" class="apple-btn apple-btn-secondary" data-i18n="history.prev">Previous</button>
      <button id="next-btn" class="apple-btn apple-btn-secondary" data-i18n="history.next">Next</button>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>

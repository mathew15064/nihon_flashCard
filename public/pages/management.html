<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="management.title">Japanese Flashcard — Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/pages/dashboard.html" class="text-slate-600 hover:underline text-sm" data-i18n="nav.dashboard">&larr; Dashboard</a>
      <h1 class="font-bold text-slate-800" data-i18n="management.title">Management</h1>
      <select id="locale-select" class="border border-slate-300 rounded-lg px-2 py-1 text-sm" aria-label="Language">
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="en">🇺🇸 English</option>
      </select>
    </div>
    <div class="max-w-4xl mx-auto px-4 pb-3 flex flex-wrap gap-2 text-sm">
      <button class="tab-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg" data-tab="users" data-i18n="management.users">Users</button>
      <button class="tab-btn bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg" data-tab="hiragana" data-i18n="management.hiragana">Hiragana</button>
      <button class="tab-btn bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg" data-tab="katakana" data-i18n="management.katakana">Katakana</button>
      <button class="tab-btn bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg" data-tab="kanji" data-i18n="management.kanji">Kanji</button>
      <button class="tab-btn bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg" data-tab="vocabulary" data-i18n="management.vocabulary">Vocabulary</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <p id="error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-2 text-sm"></p>

    <section id="toolbar" class="flex flex-wrap gap-2 items-center mb-4"></section>

    <ul id="item-list" class="space-y-2">
      <li class="text-slate-400 text-sm" data-i18n="management.loading">Loading…</li>
    </ul>

    <!-- create/edit dialog -->
    <div id="form-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-10">
      <form id="entity-form" class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md space-y-3"></form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/management.js"></script>
</body>
</html>

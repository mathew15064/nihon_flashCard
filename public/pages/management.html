<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Management — Japanese Flashcard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment min-h-screen">

  <nav class="apple-nav">
    <div class="max-w-5xl w-full mx-auto px-4 flex items-center justify-between gap-3">
      <a href="/pages/dashboard.html" class="apple-nav-brand" data-i18n="nav.dashboard">Dashboard</a>
      <div class="flex items-center gap-2">
        <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
      </div>
    </div>
  </nav>

  <div class="apple-subnav">
    <div class="max-w-5xl w-full mx-auto px-4 flex items-center gap-2 overflow-x-auto">
      <button class="tab-btn apple-btn !min-h-[36px] !py-1.5 !px-4 !text-sm apple-btn-primary" data-tab="users" data-i18n="management.users">Users</button>
      <button class="tab-btn apple-btn apple-btn-secondary !min-h-[36px] !py-1.5 !px-4 !text-sm" data-tab="hiragana" data-i18n="management.hiragana">Hiragana</button>
      <button class="tab-btn apple-btn apple-btn-secondary !min-h-[36px] !py-1.5 !px-4 !text-sm" data-tab="katakana" data-i18n="management.katakana">Katakana</button>
      <button class="tab-btn apple-btn apple-btn-secondary !min-h-[36px] !py-1.5 !px-4 !text-sm" data-tab="kanji" data-i18n="management.kanji">Kanji</button>
      <button class="tab-btn apple-btn apple-btn-secondary !min-h-[36px] !py-1.5 !px-4 !text-sm" data-tab="vocabulary" data-i18n="management.vocabulary">Vocabulary</button>
    </div>
  </div>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-6">
      <h1 class="apple-headline" data-i18n="management.title">Management</h1>
    </header>

    <p id="error" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-2 text-sm"></p>

    <section id="toolbar" class="flex flex-wrap gap-2 items-center mb-6"></section>

    <ul id="item-list" class="space-y-3">
      <li class="apple-caption" data-i18n="management.loading">Loading…</li>
    </ul>

    <div id="form-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-10">
      <form id="entity-form" class="bg-white rounded-[18px] border border-hairline p-6 w-full max-w-md space-y-3 max-h-[90vh] overflow-y-auto"></form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/management.js"></script>
</body>
</html>

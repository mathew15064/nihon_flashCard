<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Learn — Japanese Flashcard</title>
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-parchment flashcard-screen flex flex-col">

  <!-- Apple-style slim black nav -->
  <nav class="apple-nav shrink-0">
    <div class="max-w-3xl w-full mx-auto px-4 flex items-center justify-between gap-2">
      <a href="/pages/dashboard.html" class="apple-nav-brand" data-i18n="nav.dashboard">Dashboard</a>
      <div class="flex items-center gap-2">
        <select id="locale-select" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
        <select id="content-type" class="bg-transparent border border-white/30 rounded-full px-2 py-0.5 text-xs text-white" aria-label="Content type">
          <option value="hiragana" data-i18n="content.hiragana">Hiragana</option>
          <option value="katakana" data-i18n="content.katakana">Katakana</option>
          <option value="kanji" data-i18n="content.kanji">Kanji</option>
          <option value="vocabulary" data-i18n="content.vocabulary">Vocabulary</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- Frosted subnav with lesson filter -->
  <div class="apple-subnav shrink-0">
    <div class="max-w-3xl w-full mx-auto px-4 flex items-center gap-3">
      <select id="lesson-select" class="apple-input text-sm !py-1.5 !min-h-[36px] flex-1 max-w-xs">
        <option value="" data-i18n="session.all">All lessons</option>
      </select>
    </div>
  </div>

  <main class="max-w-3xl w-full mx-auto px-4 flex-1 flex flex-col min-h-0">
    <p id="error" class="hidden mb-2 rounded-lg bg-red-50 text-red-700 px-4 py-2 text-sm"></p>

    <p id="progress-line" class="text-center apple-caption mt-3 shrink-0"></p>

    <!-- Session list (lesson mode) -->
    <div id="session-panel" class="hidden w-full shrink-0 my-3 space-y-3">
      <p id="session-summary" class="text-center text-sm font-semibold text-ink"></p>
      <div id="session-list" class="space-y-3"></div>
    </div>

    <!-- Thumb-zone spacer -->
    <div class="flex-[2] min-h-[8px]"></div>

    <p id="empty-state" class="hidden text-center apple-caption py-16" data-i18n="learn.empty">
      No cards available for this content type yet.
    </p>

    <div id="card-wrap" class="relative hidden shrink-0 w-full">
      <p id="swipe-badge"
        class="hidden absolute top-3 right-5 z-10 text-lg font-semibold px-3 py-1 rounded-full border-2 rotate-6 pointer-events-none opacity-0 transition-opacity duration-150"></p>
      <div id="card"
        class="bg-white border border-hairline rounded-[18px] shadow-none px-6 py-10 sm:p-10
               min-h-[42dvh] sm:min-h-[20rem] max-h-[55dvh] sm:max-h-none
               w-[calc(100vw-32px)] sm:w-auto max-w-md lg:max-w-xl mx-auto
               flex flex-col items-center justify-center text-center cursor-pointer select-none
               [touch-action:pan-y] overflow-hidden">

        <p id="card-front" class="text-5xl sm:text-7xl font-semibold text-ink break-all"></p>

        <p id="reveal-hint" class="mt-6 apple-caption" data-i18n="learn.tapToReveal">Tap to reveal</p>

        <div id="card-back" class="hidden mt-6 border-t border-hairline pt-6 w-full">
          <div id="card-image-wrap" class="hidden mb-4 mx-auto w-full max-w-[220px] sm:max-w-[260px]">
            <div class="relative rounded-[18px] overflow-hidden bg-parchment aspect-[4/3]">
              <div id="image-skeleton" class="absolute inset-0 animate-pulse bg-divider"></div>
              <img id="card-image" alt="" class="hidden absolute inset-0 w-full h-full object-cover" loading="lazy" />
            </div>
          </div>
          <p id="answer-reading" class="hidden text-2xl text-ink-soft"></p>
          <p id="answer-romanization" class="hidden text-lg italic text-ink-muted"></p>
          <p id="answer-main" class="mt-4 text-3xl font-semibold text-action"></p>
          <p id="answer-extra" class="mt-2 text-ink-muted break-words"></p>
        </div>
      </div>
    </div>

    <div class="flex-[3] min-h-[8px]"></div>

    <div id="controls" class="shrink-0 pb-safe">
      <div class="flex justify-center gap-3 max-w-md mx-auto">
        <button id="wrong-btn" disabled
          class="apple-btn apple-btn-wrong flex-1"
          data-i18n="learn.wrong">Wrong</button>
        <button id="correct-btn" disabled
          class="apple-btn apple-btn-correct flex-1"
          data-i18n="learn.correct">Correct</button>
      </div>
      <button id="reveal-btn"
        class="apple-btn apple-btn-dark block mx-auto mt-3 mb-2 px-10"
        data-i18n="learn.reveal">Reveal</button>
      <p id="status-line" class="text-center apple-caption h-4"></p>
      <p class="text-center apple-caption pb-2" data-i18n="learn.hint"></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/vi.js"></script>
  <script src="/js/i18n/i18n.js"></script>
  <script src="/js/card-render.js"></script>
  <script src="/js/flashcard.js"></script>
</body>
</html>

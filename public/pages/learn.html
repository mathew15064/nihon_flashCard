<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Flashcard — Learn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/pages/dashboard.html" class="text-slate-600 hover:underline text-sm">&larr; Dashboard</a>
      <h1 class="font-bold text-slate-800">Learn</h1>
      <select id="content-type" class="border border-slate-300 rounded-lg px-2 py-1 text-sm">
        <option value="hiragana">Hiragana</option>
        <option value="katakana">Katakana</option>
        <option value="kanji">Kanji</option>
        <option value="vocabulary">Vocabulary</option>
      </select>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <p id="error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-2 text-sm"></p>

    <div id="card" class="hidden bg-white rounded-2xl shadow-lg p-10 min-h-[16rem] flex flex-col items-center justify-center text-center cursor-pointer select-none">
      <p id="card-front" class="text-5xl sm:text-8xl font-semibold text-slate-800 break-all"></p>
      <div id="card-back" class="hidden mt-6 border-t border-slate-200 pt-6 w-full">
        <p id="answer-main" class="text-3xl font-medium text-indigo-700"></p>
        <p id="answer-extra" class="mt-2 text-slate-500 break-words"></p>
      </div>
    </div>

    <p id="empty-state" class="hidden text-center text-slate-400 py-16">
      No cards available for this content type yet.
    </p>

    <div class="mt-8 flex justify-center gap-4">
      <button id="wrong-btn" disabled
        class="bg-red-500 hover:bg-red-600 disabled:opacity-40 text-white font-medium px-8 py-3 rounded-xl w-32">
        Wrong
      </button>
      <button id="reveal-btn"
        class="bg-slate-700 hover:bg-slate-800 text-white font-medium px-8 py-3 rounded-xl w-32">
        Reveal
      </button>
      <button id="correct-btn" disabled
        class="bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 text-white font-medium px-8 py-3 rounded-xl w-32">
        Correct
      </button>
    </div>
    <p id="status-line" class="text-center text-xs text-emerald-700 mt-2 h-4"></p>
    <p class="text-center text-xs text-slate-400 mt-3">Space: reveal / next · ← Wrong · → Correct</p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/current-user.js"></script>
  <script src="/js/flashcard.js"></script>
</body>
</html>
